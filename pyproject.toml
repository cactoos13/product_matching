fastapi = "^0.115.6"
uvicorn = "^0.34.0"
datasketch = "^1.6.5"
sqlalchemy = "^2.0.37"
alembic = "^1.14.1"
pyyaml = "^6.0.2"
celery = { version = "^5.4.0", extras = ["redis"] }

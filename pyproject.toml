redis = "^5.2.1"
billiard = "^4.2.1"
joblib = "^1.4.2"
numpy = "^2.2.3"
scikit-learn = "1.5.2"
cryptography = "^44.0.1"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.poetry.scripts]
start = "scripts:start_app"